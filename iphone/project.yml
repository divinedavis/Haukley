name: Haukley
options:
  bundleIdPrefix: com.haukley
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  GoogleInteractiveMediaAds:
    url: https://github.com/googleads/swift-package-manager-google-interactive-media-ads-ios
    from: 3.33.0
settings:
  base:
    DEVELOPMENT_TEAM: CG89RY4W6R
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "23"
    SWIFT_VERSION: "5.0"
    # Xcode 26's debug dylib makes `simctl launch` fail with "denied by service delegate".
    ENABLE_DEBUG_DYLIB: NO
targets:
  Haukley:
    type: application
    platform: iOS
    sources:
      # Resources live under sources: XcodeGen has no target-level resources key.
      - path: Haukley
        excludes:
          - "Resources/Catalog/**"
      # A folder reference keeps Catalog/<id>/poster.jpg paths; as a group every
      # poster.jpg would collide at the bundle root.
      - path: Haukley/Resources/Catalog
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleInteractiveMediaAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haukley.app
        PRODUCT_NAME: Haukley
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this the AccentColor asset is ignored and everything falls back to system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Haukley
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad: every orientation, so the app can run in Split View and Stage Manager.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    info:
      path: Haukley/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Asked only when the viewer taps "Use my current location" on Haukley Weather.
        # haukley://row/<key> and haukley://title/<id> (In-App Event deep links).
        CFBundleURLTypes:
          - CFBundleURLName: com.haukley.app
            CFBundleURLSchemes: [haukley]
        NSLocationWhenInUseUsageDescription: "Haukley uses your approximate location to show your local forecast on Haukley Weather. It's only used when you tap Use my current location."
  HaukleyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HaukleyTests
    dependencies:
      - target: Haukley
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haukley.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Haukley.app/Haukley"
  HaukleyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HaukleyUITests
    dependencies:
      - target: Haukley
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haukley.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Haukley
schemes:
  Haukley:
    build:
      targets:
        Haukley: all
        HaukleyTests: [test]
        HaukleyUITests: [test]
    test:
      targets:
        - HaukleyTests
        - HaukleyUITests
