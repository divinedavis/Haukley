<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Watch — Haukley</title>
  <meta name="description" content="Watch free movies and shows on Haukley.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=8">
</head>
<body>
  <div id="app"></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-scrim" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>

  <div id="player" class="player" hidden>
    <video id="video" playsinline preload="auto"></video>
    <div id="ad-layer" class="ad-layer"></div>
    <div class="rated" id="rated" hidden><b id="rated-label"></b><span id="rated-sub"></span></div>
    <div class="p-top">
      <button class="p-btn" id="p-back" aria-label="Back to browse">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-7l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="p-btn" id="p-report" href="mailto:support@haukley.com?subject=Playback%20problem" aria-label="Report a problem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 0h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </a>
    </div>
    <div class="p-bottom">
      <div class="p-scrub">
        <input type="range" id="p-seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <span id="p-remaining">0:00</span>
      </div>
      <div class="p-row">
        <button class="p-btn" id="p-play" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14.5-8.5z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h4v18H6zm8 0h4v18h-4z" fill="currentColor"/></svg>
        </button>
        <button class="p-btn" id="p-back10" aria-label="Back 10 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 3.5A8.5 8.5 0 1 1 3.3 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 1l-4 2.7L12 6.4z" fill="currentColor"/><text x="12.3" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" font-family="Inter, sans-serif">10</text></svg>
        </button>
        <button class="p-btn" id="p-fwd10" aria-label="Forward 10 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 3.5A8.5 8.5 0 1 0 20.7 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 1l4 2.7L12 6.4z" fill="currentColor"/><text x="11.7" y="16" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" font-family="Inter, sans-serif">10</text></svg>
        </button>
        <div class="p-vol">
          <button class="p-btn" id="p-mute" aria-label="Mute">
            <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/><path d="M16 9l6 6m0-6l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <input type="range" id="p-volume" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
        <div class="p-title" id="p-title"></div>
        <div class="p-speed">
          <button class="p-btn" id="p-speed" aria-label="Playback speed" aria-haspopup="menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 17a8.5 8.5 0 1 1 15 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 13l4-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="13" r="1.6" fill="currentColor"/></svg>
          </button>
          <div class="p-menu" id="p-speed-menu" role="menu" hidden></div>
        </div>
        <button class="p-btn" id="p-full" aria-label="Full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <p class="p-error" id="p-error" hidden></p>
  </div>

  <script src="vendor/supabase.js"></script>
  <script src="vendor/hls.light.min.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
