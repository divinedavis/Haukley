# Haukley landing page (streaming app). Static; TLS via certbot once DNS points here.
server {
    server_name haukley.com www.haukley.com;

    if ($host = www.haukley.com) {
        return 301 https://haukley.com$request_uri;
    }

    root /var/www/haukley;
    index index.html;
    access_log /var/log/nginx/haukley-access.log;
    error_log /var/log/nginx/haukley-error.log;

    # Security headers (2026-09-26 audit). Sources verified against every page:
    # inline <script> on / and /filmmakers/, inline style attrs, Google Fonts,
    # and site.js POSTs the waitlist to Supabase. A location with its own
    # add_header drops these, so /img/ repeats them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://axgxpwgbpgcqjxoqwtnv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location /img/ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Web player: signed-in streaming with Google IMA ads. IMA loads its SDK and creatives
    # from Google hosts and renders ads in iframes; video segments and ad media come from
    # several CDNs, so media/connect/img/frame allow https: while script hosts stay pinned
    # ('unsafe-inline' because IMA injects inline scripts; the app itself has none).
    location /watch/ {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://imasdk.googleapis.com https://s0.2mdn.net https://*.googlesyndication.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    location /watch/catalog/ {
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/haukley.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/haukley.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.haukley.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = haukley.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name haukley.com www.haukley.com;
    return 404; # managed by Certbot




}