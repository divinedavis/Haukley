# Haukley landing page (streaming app). Static; TLS via certbot once DNS points here.
server {
    server_name haukley.com www.haukley.com;

    if ($host = www.haukley.com) {
        return 301 https://haukley.com$request_uri;
    }

    root /var/www/haukley;
    index index.html;
    access_log /var/log/nginx/haukley-access.log;
    error_log /var/log/nginx/haukley-error.log;

    # Security headers (2026-09-26 audit). Sources verified against every page:
    # inline <script> on / and /filmmakers/, inline style attrs, Google Fonts,
    # and site.js POSTs the waitlist to Supabase. A location with its own
    # add_header drops these, so /img/ repeats them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://axgxpwgbpgcqjxoqwtnv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location /img/ {
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Web player: signed-in streaming with Google IMA ads. IMA loads its SDK and creatives
    # from Google hosts and renders ads in iframes; ad media comes from several CDNs, so
    # media/img/frame allow https: while script and connect hosts stay pinned.
    location /watch/ {
        try_files $uri $uri/ =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # No 'unsafe-inline' scripts (the page has none; IMA's same-origin OMID bootstrap is blocked,
        # ads still play) and connect-src limited to Supabase, the stream CDN and Google's ad hosts.
        # Verified with a signed-in Playwright playback incl. a Google sample pre-roll, 2026-10-07.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://imasdk.googleapis.com https://s0.2mdn.net https://*.googlesyndication.com https://www.gstatic.com https://*.adtrafficquality.google; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self' https://axgxpwgbpgcqjxoqwtnv.supabase.co wss://axgxpwgbpgcqjxoqwtnv.supabase.co https://haukley-media.nyc3.cdn.digitaloceanspaces.com https://imasdk.googleapis.com https://*.doubleclick.net https://*.googlesyndication.com https://*.2mdn.net https://*.adtrafficquality.google https://www.google.com https://*.gstatic.com; frame-src https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    # The LG/Samsung TV apps (tvweb/) run from file:// and fetch catalog.json cross-origin.
    # Public catalog data, no credentials, so any origin may read it.
    location /watch/catalog/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Ad schedules (VMAP) read by the IMA SDK from its own origin, with credentials, so CORS
    # must echo that origin exactly. Native apps (Android/Roku/tvOS) don't send Origin.
    location /ads/ {
        set $ads_cors "";
        if ($http_origin ~ "^(https?://imasdk\.googleapis\.com|https://haukley\.com)$") {
            set $ads_cors $http_origin;
        }
        types { application/xml xml; }
        add_header Access-Control-Allow-Origin $ads_cors always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/haukley.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/haukley.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.haukley.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = haukley.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name haukley.com www.haukley.com;
    return 404; # managed by Certbot




}